@if(users$ | async; as users){

  <table class="table">
      <thead>
        <tr>
          <th scope="col">Id</th>
          <th scope="col">Nombre</th>
          <th scope="col">Correo</th>
          <th scope="col">Teléfono</th>
        </tr>
      </thead>
      <tbody>
        @for (u of users; track u.id){
            <tr>

                <th scope="row">{{ u.id }}</th>
                <td>{{ u.name }}</td>
                <td>{{ u.email }}</td>
                <td>{{ u.phone }}</td>
            </tr>
        }
      </tbody>
    </table>
} @else{
  <p>Cargando..... 😒😒😒😒😒😒😒😒😒</p>
}
